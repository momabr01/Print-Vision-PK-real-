<svg viewBox="0 0 320 180" width="320" height="180" xmlns="http://www.w3.org/2000/svg">
  <!-- Parwaz Printing & Packaging Logo -->
  <defs>
    <radialGradient id="sunYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF200" />
      <stop offset="100%" stop-color="#FFD700" />
    </radialGradient>
  </defs>

  <!-- CMYK 3-blade swirl symbol on top -->
  <g transform="translate(160, 42)">
    <!-- Cyan Swirl Blade (bottom-right) -->
    <path d="M -16,10 C -4,26 24,24 35,8 C 24,18 -2,18 -16,10 Z" fill="#00AEEF" />
    <path d="M -16,10 C 2,16 28,16 35,8 C 20,4 0,0 -16,10 Z" fill="#0072BC" />

    <!-- Magenta Swirl Blade (top-right) -->
    <path d="M -10,-14 C 6,-30 26,-8 26,8 C 18,-6 2,-18 -10,-14 Z" fill="#EC008C" />
    
    <!-- Yellow-Green Swirl Blade (top-left) -->
    <path d="M -12,-8 C -24,-24 -6,-28 10,-24 C -6,-20 -18,-2 -12,-8 Z" fill="#8DC63F" />

    <!-- Center Yellow Glowing Orb -->
    <circle cx="0" cy="0" r="11" fill="url(#sunYellow)" />
  </g>

  <!-- PARWAZ 3D Red Script Typography -->
  <g transform="translate(10, 80)">
    <!-- Drop Shadow / 3D edge -->
    <text x="150" y="52" font-family="'Arial Black', Impact, sans-serif" font-style="italic" font-size="64" font-weight="900" fill="#990000" text-anchor="middle" letter-spacing="-2">
      parwaz
    </text>
    <!-- Main 3D Red Lettering -->
    <text x="148" y="50" font-family="'Arial Black', Impact, sans-serif" font-style="italic" font-size="64" font-weight="900" fill="#E51A2E" text-anchor="middle" letter-spacing="-2">
      parwaz
    </text>
  </g>

  <!-- SETTING NEW STANDARDS in Italic Black Caps -->
  <text x="160" y="156" font-family="'Arial Black', Impact, sans-serif" font-style="italic" font-size="19" font-weight="900" fill="#16130F" text-anchor="middle" letter-spacing="1.5">
    SETTING NEW STANDARDS
  </text>
</svg>
