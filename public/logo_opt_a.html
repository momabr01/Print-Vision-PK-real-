<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #f3efe7; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .box { width: 400px; height: 400px; }
  </style>
</head>
<body>
  <div class="box">
    <svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#333333" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="192" fill="#FFFFFF" stroke="#16130F" stroke-width="2.5" />
  <ellipse cx="200" cy="380" rx="46" ry="7" fill="url(#sh1)" />
  <polygon points="48,96 352,96 200,362" fill="#E8791F" stroke="#16130F" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Clean, bold, upright P with beautiful proportion and zero clipping -->
  <text
    x="202"
    y="235"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif"
    font-weight="900"
    font-size="220"
    fill="#16130F"
    text-anchor="middle"
    dominant-baseline="central"
  >P</text>
</svg>
  </div>
</body>
</html>
